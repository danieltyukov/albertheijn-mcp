name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Pack the tarball
        run: |
          npm pack
          mv albertheijn-mcp-*.tgz albertheijn-mcp.tgz
          tar -tzf albertheijn-mcp.tgz | head -20
      - run: npm run check:install -- albertheijn-mcp.tgz
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: albertheijn-mcp.tgz
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
      # Trusted publishing: npm accepts this workflow's OIDC token, so no npm token is stored.
      # It runs once the package is set up on npmjs.com (repository variable NPM_PUBLISH=true).
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          npm install -g npm@11
          npm publish --provenance --access public
